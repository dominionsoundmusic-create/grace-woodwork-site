<section class="band band--forest faq" id="common-questions" aria-labelledby="faq-title">
  <h2 id="faq-title">{{ page.faq_title | default('Common questions') }}</h2>
  <div class="faq__list">
  {% for f in page.faqs %}
    <details class="faq__item"{% if loop.first %} open{% endif %}>
      <summary><h3>{{ f.q }}</h3></summary>
      <div class="faq__a">{{ f.a if f.a.startswith('<') else '<p>' ~ f.a ~ '</p>' }}</div>
    </details>
  {% endfor %}
  </div>
</section>
